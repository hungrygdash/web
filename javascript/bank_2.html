<!DOCTYPE html>
<html>
<head>
    <style>
        /* ---------- PART 1: typography for the whole page ---------- */
body {
  font-family: Arial, Helvetica, sans-serif;
  background-color: #eef1f5;
}

/* ---------- PART 4: the app card with a box shadow ---------- */
#app {
  width: 320px;
  margin: 40px auto;
  padding: 24px;
  background-color: #ffffff;
  border-radius: 12px;
  box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.2);
}

/* ---------- PART 2: text-transform on the title ---------- */
#app-title {
  text-transform: uppercase;
  font-size: 22px;
  color: #1a3d6d;
  text-align: center;
}

/* ---------- PART 3: text-decoration underline on the labels ---------- */
#balance-label, #amount-label {
  text-decoration: underline;
  font-size: 14px;
  color: #555555;
}

/* the balance figure itself */
#balance {
  font-size: 32px;
  font-weight: bold;
  color: #1a3d6d;
  margin-top: 4px;
}

#amount {
  width: 100%;
  padding: 10px;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 16px;
  border: 1px solid #cccccc;
  border-radius: 6px;
}

#button-box {
  text-align: center;
  margin-top: 16px;
}

/* ---------- PART 5: shared button styling + box shadow ---------- */
.action {
  padding: 10px 22px;
  margin: 6px;
  border: none;
  border-radius: 6px;
  color: #ffffff;
  font-weight: bold;
  font-size: 15px;
  cursor: pointer;
  box-shadow: 0px 2px 6px rgba(0, 0, 0, 0.25);
}

/* only the colour differs, so only the colour is written twice */
.credit {
  background-color: #2e9e5b;
}

.debit {
  background-color: #d14343;
}

/* ---------- PART 6: text-decoration line-through on the note ---------- */
#note {
  text-decoration: line-through;
  font-size: 11px;
  color: #999999;
  text-align: center;
  margin-top: 18px;
}

#extra {
   color: #1a3d6d;
  text-align: center;
  font-size: 18px;
  font-weight: bold;
}

    </style>
  <title>Nicholas's Bank App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="app">
    <h1 id="app-title">Nicholas's bank</h1>

    <div id="balance-box">
      <p id="balance-label">Available balance</p>
      <p id="balance">1000000</p>
    </div>

    <div id="entry-box">
      <label id="amount-label" for="amount">Enter amount</label>
      <input type="number" id="amount" placeholder="0">
    </div>

    <div id="button-box">
      <button class="action credit" id="credit-btn">Credit</button>
      <button class="action debit" id="debit-btn">Debit</button>
    </div>

    <div id="extra">
      <p>add or take some money!</p>
    </div>

    <p id="note">Terms and conditions apply</p>
  </div>
<script>
  // ---------- PART 1: helper functions ----------

function getBalance() {
    return Number(document.getElementById("balance").innerText);
}

function printBalance(num) {
    document.getElementById("balance").innerText = num;
}

function getAmount() {
    return Number(document.getElementById("amount").value);
}

function showMessage(text) {
    document.getElementById("message").innerText = text;
}

function clearAmount() {
    document.getElementById("amount").value = "";
}


// ---------- PART 4: is the typed amount usable? ----------

function isAmountValid() {
    var typed = document.getElementById("amount").value;

    if (typed == "") {
        showMessage("Please enter an amount.");
        return false;
    } else if (Number(typed) <= 0) {
        showMessage("Amount must be more than zero.");
        return false;
    }

    return true;
}


// ---------- PART 2: Credit ----------

document.getElementById("credit-btn").addEventListener("click", function () {

    if (isAmountValid() == false) {
        return;
    }

    var amount = getAmount();
    var newBalance = getBalance() + amount;

    printBalance(newBalance);
    showMessage("Credited " + amount + " successfully.");
    clearAmount();

});


// ---------- PART 3 + PART 5: Debit ----------

document.getElementById("debit-btn").addEventListener("click", function () {

    if (isAmountValid() == false) {
        return;
    }

    var amount = getAmount();

    // PART 5 — you cannot spend money you do not have
    if (amount > getBalance()) {
        showMessage("Not enough balance.");
        return;
    }

    var newBalance = getBalance() - amount;

    printBalance(newBalance);
    showMessage("Debited " + amount + " successfully.");
    clearAmount();

});
</script>
</body>
</html>
