<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Draw</title>
</head>
<body>
    <h1>Lucky Draw</h1>
    <p>Enter your name and guess a number to win!</p>

    <input type="text" id="name" placeholder="Your name" required><br>
    <p id="msg-name"></p>

    <input type="number" id="guess" placeholder="Guess a number (1 to 100)" min="1" max="100" required><br>
    <p id="msg-guess"></p>
    
    <button onclick="checkForm()">Try my luck!</button>
    <p id="result"></p>
    <p id="timer"></p>

    <script>
        var seconds = 0;

        setInterval(function() {
            seconds = seconds + 1;
            document.getElementById("timer").textContent =
                "You have been here for " + seconds + " seconds!";
        }, 1000);

        function checkForm() {
            var name = document.getElementById("name").value;
            var guess = document.getElementById("guess").value;
            var ok = true;

            if (name == "") {
                document.getElementById("msg-name").textContent =
                    "Please enter your name!";
                document.getElementById("msg-name").style.color = "red";
                ok = false;
            } else {
                document.getElementById("msg-name").textContent =
                    "Great name!";
                document.getElementById("msg-name").style.color = "green";
            }

            if (guess == "") {
                document.getElementById("msg-guess").textContent =
                    "Please enter a guess!";
                document.getElementById("msg-guess").style.color = "red";
                ok = false;
            } else {
                document.getElementById("msg-guess").textContent =
                    "Guess saved!";
                document.getElementById("msg-guess").style.color = "green";
            }

            if (ok == true) {
                var lucky = Math.floor(Math.random() * 100) + 1;

                if (guess == lucky) {
                    document.getElementById("result").textContent =
                        "You win, " + name +
                        "! The lucky number was " + lucky + "!";
                    document.getElementById("result").style.color = "green";
                } else {
                    document.getElementById("result").textContent =
                        "So close, " + name +
                        "! The lucky number was " + lucky + ". Try again!";
                    document.getElementById("result").style.color = "navy";
                }
            }
        }
    </script>
</body>
</html>
